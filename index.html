<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap">
<style>

:root[data-theme=dark]{--bg:#0f1812;--pn:#17231b;--ink:#e4eee7;--mu:#93a699;--ln:#2a3b2f;--ac:#5fc08b;--bad:#fb923c;--gl:#2d4a5c;--gp:#132019;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.45 'Bricolage Grotesque',system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--ln);background:var(--pn)}
h1{font-size:20px;font-weight:800;margin:0 8px 0 0;letter-spacing:-.02em}h2{font-size:13px;margin:0 0 6px;font-weight:800}
.ctl{display:flex;gap:6px;align-items:center;color:var(--mu)}input,select,textarea{font:inherit;color:var(--ink);background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:4px 6px}input[type=number]{width:52px}
button{font:inherit;color:var(--ink);background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:5px 10px;cursor:pointer}button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.on{outline:2px solid var(--ac)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr) 290px;gap:12px;padding:12px;align-items:start}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px}
.pal{display:flex;flex-direction:column;gap:6px}.pb{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border-left-width:6px}.pb.on{background:var(--gp)}.pb small{color:var(--mu);display:block}
.wrap{overflow:auto;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--pn)}
.edge{font-size:12px;color:var(--mu);text-align:center;padding:3px}
#grid{position:relative;margin:0 auto;background-color:var(--gp);background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px),linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);border:2px solid var(--ac);touch-action:manipulation}
.it{position:absolute;border:2px solid rgba(255,255,255,.75);border-radius:5px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;cursor:grab;touch-action:none;font-size:11px;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.5);user-select:none}
.it b{font-size:18px}.it small{opacity:.9}.it.sel{outline:3px solid #fff;box-shadow:0 0 0 5px var(--ac);z-index:3}.it.la{animation:pu 1s infinite alternate}@keyframes pu{to{opacity:.55}}@media(prefers-reduced-motion:reduce){.it.la{animation:none;opacity:.6}}
.gh{position:absolute;border:2px dashed var(--ac);background:rgba(47,125,79,.25);pointer-events:none;display:none;z-index:4}.gh.bad{border-color:var(--bad);background:rgba(194,65,12,.3)}
svg.ln{position:absolute;inset:0;pointer-events:none;z-index:2}
.fs{position:absolute;left:0;right:0;bottom:0;height:6px;background:#fde047}.pb{line-height:1.25}.pal{max-height:78vh;overflow:auto}ol{padding-left:18px;margin:6px 0}.stage{position:relative;padding:96px;width:max-content;margin:0 auto}#sun{position:absolute;inset:0;pointer-events:none;font-size:11px;color:var(--mu)}#sun>div{position:absolute;text-align:center;line-height:1.15;transform:translate(-50%,-50%);white-space:nowrap}
.sunrow{display:flex;align-items:center;gap:8px;margin:8px auto 0;color:var(--mu);font-size:12px}.sunrow>div{text-align:center;line-height:1.2}.sunrow svg.arc{flex:1;height:36px;min-width:0}
.dh{border-left:6px solid;padding-left:9px}.kv h3{font-size:12px;margin:12px 0 2px;color:var(--mu);font-weight:600}.kv p{margin:0}.kv ul{padding-left:0}
.side{display:flex;flex-direction:column;gap:12px}ul{margin:0;padding:0;list-style:none}li{padding:3px 0;border-bottom:1px dotted var(--ln)}li:last-child{border:0}
.w{color:var(--bad)}.ok{color:var(--ac)}.mu{color:var(--mu)}.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9;padding:14px}#dlg>div{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px;width:min(760px,100%);max-height:90%;display:flex;flex-direction:column;gap:8px}#dlg textarea{flex:1;min-height:320px;font:12px/1.4 ui-monospace,Menlo,monospace}
@media(max-width:900px){.app{grid-template-columns:1fr}.pal{flex-direction:row;overflow:auto}.pb{width:auto;flex:none}}
</style>
<link rel="stylesheet" href="theme.css"></head><body>
<header><h1>🌱 Garden Architect</h1>
<label class="ctl">Width <input id="cols" type="number" min="2" max="16"> × Depth <input id="rows" type="number" min="2" max="16"> blocks</label>
<label class="ctl">Units <select id="unit"><option value="ft">ft</option><option value="m">m</option></select></label>

<span style="flex:1"></span>

bio:{n:'Biological Engine',sub:'Coop + Pond',d:'Chickens over a fish pond',w:2,h:2,about:'The heart of the system. Chickens live on a slatted floor above a shallow pond. Manure feeds the water, fish turn it into plant food, and duckweed goes back to the hens.',rule:'Morning sun, afternoon shade. Put it at the lowest ground so water returns by gravity.',crop:'Eggs, tilapia or catfish, duckweed'},

const G={
bio:{b:'Level the site and set the posts for the 8×8 ft coop|Place the pond below the coop floor and line it with EPDM or use a rigid tank|Build the coop on stilts with a slatted floor so droppings fall into the water|Add a roof, nest boxes and predator-proof wire|Fit the pump, float valve and aerator, then cycle the pond for 4–6 weeks before adding fish',c:'D:Collect eggs, check feed and water|D:Check fish behavior and pond level|W:Test pH, ammonia, nitrite and temperature|M:Clean filters and rake out excess solids|S:Deep-clean the coop litter and inspect the posts'},

biogas:{b:'Choose a level site away from the house with room for a gas line|Install an airtight tank with a feed inlet and an effluent outlet|Connect a gas bladder with a water trap and a burner rated for biogas|Test every joint with soapy water before use|Seed with fresh manure and feed small amounts daily',c:'D:Feed scraps and manure in small, steady amounts|W:Check the bladder, joints and water trap|M:Draw off bioliquid and dilute it before use|S:Clear scum and inspect pipes. Keep flames away from leaks'},

 L.push('# Garden blueprint','',`- Yard: ${u(gc()*4)} × ${u(gr()*4)} (${S.cols} × ${S.rows} blocks of ${u(4)})`,`- Location: latitude ${S.lat}°. The top of the plan points to compass bearing ${S.rot}° (${dir8(S.rot)}). The noon sun is in the ${dir8(nz())}, so tall crops go on the ${dir8(nz()+180)} side.`,'- Positions are measured from the back-left corner: x runs right, y runs toward the front.',`- Sunrise at ${S.ra}° (${dir8(S.ra)}), sunset at ${S.sa}° (${dir8(S.sa)}). Every module faces the sun.`,'','## Modules','','| # | Module | Position (x, y) | Footprint |','|---|---|---|---|');
 S.items.forEach(i=>{const[w,h]=dim(i);L.push(`| ${i.id} | ${T[i.t].n}${i.ad.length?' + '+i.ad.map(a=>A.find(z=>z.k===a).n).join(', '):''} | ${u(i.x*4)}, ${u(i.y*4)} | ${w} × ${h} blocks (${rl(i)}) |`)});
 L.push('','## Bill of materials','');M.filter(m=>by[m.k]).forEach(m=>{L.push(`- **${m.n}** × ${by[m.k].length}`);m.bom.forEach(b=>L.push('  - '+b+' (per module)'))});
 const ad={};S.items.forEach(i=>i.ad.forEach(a=>ad[a]=(ad[a]||0)+1));Object.keys(ad).forEach(a=>{const z=A.find(q=>q.k===a);L.push(`- **${z.n}** × ${ad[a]}`,'  - '+z.bom)});
 L.push('','## Connection schedule','');if(!S.links.length)L.push('No connections drawn.');S.links.forEach(l=>{const a=get(l.a),b=get(l.b);if(a&&b)L.push(`- ${nm(a)} → ${nm(b)}: ${l.l}, about ${u(Math.round(dist(a,b)*4+2))} of line`)});
 const st=[[1,'Survey the site, level it and stake out the grid every 4 ft (1.2 m).'],[by.bio,'Build the Coop + Pond on the lowest ground first so water returns by gravity.'],[by.hub,'Raise the Hydration Hub on cinderblocks, connect gutters and install float valves.'],[by.biogas||by.bsf,'Set up the waste zone: digester and BSF bin, close to the coop and kitchen.'],[by.vine||by.wick||by.salad||by.algae||by.tree,'Build the growing modules, tall and sun-hungry ones at the back first.'],[S.links.length,'Lay the water, feed and gas lines from the connection schedule.'],[1,'Fit sensors, float valves and the solar pump, then cycle the pond for the nitrogen cycle before adding fish.']].filter(s=>s[0]);
 L.push('','## Build order','');st.forEach((s,x)=>L.push(`${x+1}. ${s[1]}`));L.push('','## Notes','',...S.items.filter(i=>i.note).map(i=>`- ${nm(i)}: ${i.note}`));L.push('',care().replace('# Care plan','## Care plan'),'## Build and care guides','',gtext(Object.keys(by)));const w=checks();L.push('','## Open issues','');L.push(...(w.length?w.map(x=>'- '+x):['- None found']));return L.join('\n')}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.k){pal=pal===t.dataset.k?null:t.dataset.k;sel=null;tool='sel';linkA=null;render();return}
 if(t.dataset.rm){S.links.splice(+t.dataset.rm,1);render();return}
 if(t.dataset.tab){tab=t.dataset.tab;render();return}const a=t.dataset.a;if(!a)return;
 if(a==='rot')rot();else if(a==='del')del();else if(a==='link'){tool=tool==='link'?'sel':'link';pal=null;linkA=null;say(tool==='link'?'Click one module, then another, to connect them.':'');render()}
 else if(a==='arr')arrange();else if(a==='auto')auto();else if(a==='clr'){S.items=[];S.links=[];sel=null;S.n=1;render()}
 else if(a==='loc'){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{S.lat=+p.coords.latitude.toFixed(1);S.rot=S.lat<0?180:0;render()},()=>say('Could not read your location. Type your latitude instead.'));else say('Location is not available. Type your latitude instead.')}else if(a==='undo')undo();else if(a==='exp'||a==='imp'||a==='bp'||a==='care'||a==='gd')openD(a);else if(a==='close')$('#dlg').style.display='none';
 else if(a==='copy'){const x=$('#dx');x.select();try{navigator.clipboard.writeText(x.value).catch(()=>document.execCommand('copy'))}catch(_){try{document.execCommand('copy')}catch(__){}}t.textContent='Copied'}
 else if(a==='dl'){const m=$('#dlg').dataset.mode,b=new Blob([$('#dx').value],{type:'text/plain'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=m==='bp'?'garden-blueprint.md':'garden-layout.json';l.click()}
 else if(a==='load'){try{const o=JSON.parse($('#dx').value);if(!Array.isArray(o.items)||!Array.isArray(o.links))throw 0;o.items.forEach(i=>{if(!T[i.t])throw 0;i.ad=i.ad||[]});S={...D,...o,n:Math.max(o.n||1,...o.items.map(i=>i.id+1),1)};delete S.app;delete S.v;sel=null;$('#dlg').style.display='none';render()}catch(_){$('#dt').textContent='That is not a valid layout. Paste the full JSON from Export layout.'}}});
function rot(){if(pal){pr=!pr;return}const i=get(sel);if(i&&fits(i.t,i.x,i.y,!i.r,i.id)){i.r=!i.r;render()}else say('Not enough room to rotate there.')}
function del(){if(sel){S.items=S.items.filter(i=>i.id!==sel);S.links=S.links.filter(l=>l.a!==sel&&l.b!==sel);sel=null;render()}}
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}else if(e.key==='r'||e.key==='R')rot();else if(e.key==='Delete'||e.key==='Backspace')del();else if(e.key==='Escape'){pal=null;sel=null;tool='sel';linkA=null;render()}});
$('#sp').addEventListener('change',e=>{const k=e.target.dataset.ad,i=get(sel);if(k&&i){i.ad=e.target.checked?[...i.ad,k]:i.ad.filter(x=>x!==k);render()}});
['cols','rows'].forEach(k=>$('#'+k).onchange=e=>{const v=Math.max(2,Math.min(16,+e.target.value||2)),o=S[k];S[k]=v;if(S.items.some(i=>{const[w,h]=dim(i);return i.x+w>gc()||i.y+h>gr()})){S[k]=o;say('Move or delete modules at the edge before shrinking the yard.')}render()});
$('#unit').onchange=e=>{S.unit=e.target.value;render()};[['lat',-90,90],['rot',0,359],['ra',0,359],['sa',0,359]].forEach(([k,a,b])=>$('#'+k).onchange=e=>{const v=parseFloat(e.target.value);S[k]=isNaN(v)?S[k]:Math.max(a,Math.min(b,v));render()});
$('#tpl').onchange=e=>{if(e.target.value!==''){loadTpl(+e.target.value);e.target.value=''}};
$('#sp').addEventListener('input',e=>{if(e.target.dataset.note!==undefined){const i=get(sel);if(i){i.note=e.target.value;save()}}});
render();
