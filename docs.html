<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garden Architect · Docs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap"><link rel="stylesheet" href="theme.css">
<style>
body{display:block}.top{position:sticky;top:0;z-index:30;display:flex;gap:12px;align-items:center;padding:10px 18px;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--pn) 82%,transparent);border-bottom:1px solid var(--ln)}
.top a.b{text-decoration:none;color:var(--ink);padding:6px 12px;border:1px solid var(--ln);border-radius:10px;font-weight:600;font-size:13px;background:var(--pn)}.top input{flex:1;max-width:380px;padding:7px 12px;border-radius:99px}
#prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--ac),#84cc16);z-index:40;width:0}
.lay{display:grid;grid-template-columns:240px minmax(0,820px);gap:32px;max-width:1180px;margin:0 auto;padding:22px 18px}
nav{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px);overflow:auto}nav a{display:block;padding:6px 12px;border-radius:9px;color:var(--mu);text-decoration:none;font-weight:600;font-size:13px;transition:.2s}nav a:hover{color:var(--ink);background:color-mix(in srgb,var(--ac) 10%,transparent)}nav a.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent);transform:translateX(3px)}
main section{margin-bottom:46px;scroll-margin-top:80px;animation:rise .5s both}main h1{font-size:34px;margin:0 0 6px;display:block}main h2{font-size:24px;text-transform:none;letter-spacing:-.01em;color:var(--ink);margin:0 0 12px}main h3{font-size:16px;margin:18px 0 6px}main p,main li{line-height:1.6}main ul,main ol{padding-left:20px;margin:8px 0;list-style:revert}main li{border:0}
.lead{color:var(--mu);font-size:16px}.box{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;box-shadow:var(--sh);margin:12px 0}.warn{border-left:5px solid #f97316;background:color-mix(in srgb,#f97316 9%,var(--pn))}.tip{border-left:5px solid var(--ac)}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin:10px 0}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);vertical-align:top}th{color:var(--mu);font-size:12px;text-transform:uppercase}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}.q{background:color-mix(in srgb,#eab308 20%,transparent);color:#a16207}.g{background:color-mix(in srgb,#64748b 18%,transparent);color:var(--mu)}
.mod{display:grid;grid-template-columns:150px 1fr;gap:16px;background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:14px 0;box-shadow:var(--sh)}.mod .pic{background:radial-gradient(circle at 50% 85%,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%),var(--tile);border-radius:12px;padding:6px;height:140px}.mod .pic svg{width:100%;height:100%}.mod h3{margin:0 0 4px;font-size:19px}
.bp{width:100%;max-width:330px;margin:8px 0}.bp text{font:10px 'Bricolage Grotesque',sans-serif;fill:var(--mu)}details summary{cursor:pointer;font-weight:700;color:var(--ac);margin:8px 0}
.ref li{margin:6px 0}.ref a{color:var(--ac);word-break:break-all}.hide{display:none!important}
@media(max-width:860px){.lay{grid-template-columns:1fr}nav{display:none}.mod{grid-template-columns:1fr}}
</style></head><body><div id="prog"></div>
<div class="top"><a class="b" href="index.html">← Planner</a><b>📖 Docs</b><input id="q" placeholder="Search the docs…" type="search"><button id="th" style="margin-left:auto">🌙</button></div>
<div class="lay"><nav id="nav"></nav><main id="main"></main></div>
<script src="docs-data.js"></script><script src="content.js"></script><script src="models.js"></script>
<script>
const D=DOCD,K=(c,t)=>`<span class="tag ${c}">${t}</span>`,OK=K('','✓ sourced'),GP=K('g','general practice'),AS=K('q','? assumption');
Object.assign(D.G,(window.CONTENT&&CONTENT.guides)||{});window.T={};D.M.forEach(m=>T[m.k]=m);const m2=v=>(v*1.2).toFixed(1);
const FQ={D:'Daily',W:'Weekly',M:'Monthly',S:'Seasonal'};
const bp=m=>{const W=m.w*60,H=m.h*60;return`<svg class="bp" viewBox="-30 -22 ${W+60} ${H+48}"><rect x="0" y="0" width="${W}" height="${H}" fill="${m.c}" fill-opacity=".25" stroke="${m.c}" stroke-width="2"/><path d="M0 -8H${W}M0 -12V-4M${W} -12V-4" stroke="currentColor" fill="none"/><text x="${W/2}" y="-13" text-anchor="middle">${m2(m.w)} m (${(m.w*4)} ft)</text><path d="M-8 0V${H}M-12 0H-4M-12 ${H}H-4" stroke="currentColor" fill="none"/><text transform="translate(-14 ${H/2}) rotate(-90)" text-anchor="middle">${m2(m.h)} m (${m.h*4} ft)</text><text x="${W/2}" y="${H/2+3}" text-anchor="middle">${m.n} · top view</text></svg>`};
const mods=D.M.map(m=>{const g=D.G[m.k]||{b:'',c:''},snd=D.R.filter(r=>r[0]===m.k).map(r=>(D.M.find(x=>x.k===r[1])||{}).n+' ('+r[2]+')'),rcv=D.R.filter(r=>r[1]===m.k).map(r=>(D.M.find(x=>x.k===r[0])||{}).n+' ('+r[2]+')');
return`<div class="mod" data-s style="--c:${m.c}" id="m-${m.k}"><div class="pic">${ModelKit.svg(m.k,{yaw:35,pitch:30})}</div><div><h3>${m.n} <span class="tag g">${m.sub}</span></h3><p>${m.about}</p><p><b>Where:</b> ${m.rule}<br><b>Gives you:</b> ${m.crop}</p>
<p class="tag g" style="display:inline-block">${m.w*4}×${m.h*4} ft · ${m2(m.w)}×${m2(m.h)} m</p>
<details><summary>Blueprint, parts and build steps</summary>${bp(m)}<h3>Exploded view</h3><div class="pic" style="height:230px;max-width:330px">${ModelKit.svg(m.k,{yaw:35,pitch:28,explode:.28})}</div><h3>Parts list</h3><ul>${m.bom.map(x=>'<li>'+x+'</li>').join('')}</ul><h3>Build</h3><ol>${g.b.split('|').map(x=>'<li>'+x+'</li>').join('')}</ol><h3>Care</h3><ul>${g.c.split('|').map(x=>'<li><b>'+FQ[x[0]]+':</b> '+x.slice(2)+'</li>').join('')}</ul><h3>Connections</h3><p>Sends to: ${snd.join(', ')||'none'}<br>Receives from: ${rcv.join(', ')||'none'}</p></details></div></div>`}).join('');
const S=[
['start','Start here',`<h1>Garden Architect docs</h1><p class="lead">Plan a small, connected food garden: water, animals, plants, energy and waste feeding each other. Everything here is a starting point. Local rules, climate and safety come first.</p>
<div class="box tip"><b>How to read the labels.</b> ${OK} backed by a source in <a href="#refs">References</a>. ${GP} widely used horticulture or husbandry practice, not individually cited. ${AS} placeholder number you should replace with your own.</div>
<h3>The idea in one paragraph</h3><p>Chickens sit over a fish pond, so manure becomes fish food and plant nutrients. Pond water feeds vertical towers and buckets, which clean it and return it. Waste goes to a digester and a fly-larvae bin, rainwater tops everything up, and solar runs the pumps.</p>`],
['using','Using the planner',`<h2>Using the planner</h2><table><tr><th>Do this</th><th>How</th></tr><tr><td>Place a module</td><td>Pick it in the left list, then click the plan. One block = 4 ft (1.2 m).</td></tr><tr><td>Move, rotate, delete</td><td>Drag. <kbd>R</kbd> rotates, <kbd>Delete</kbd> removes, <kbd>Esc</kbd> cancels, <kbd>Ctrl/⌘+Z</kbd> undoes.</td></tr><tr><td>Connect modules</td><td>Link tool, click two modules. Or Auto-connect for the rules in each module page.</td></tr><tr><td>Let the app arrange</td><td>Auto-arrange scores sun, pipe length, gravity, waste cluster and access. Lock modules you want fixed.</td></tr><tr><td>See it in 3D</td><td>Press 🧊 3D view. Drag to orbit, scroll to zoom, move the clock slider to watch shadows travel, or press 🚶 Walk and use W A S D to look around at eye height.</td></tr><tr><td>Save and share</td><td>Export layout (JSON), Share link (layout in the URL), Print plan, Export blueprint.</td></tr></table>
<h3>Sun and shade</h3><p>Set latitude and which way the plan's top edge points. The noon sun sits toward the equator, so shade falls the other way: tall modules go on the shade side. The date and time sliders move the shadows and give each module its sun hours.</p>`],
['tut','Tutorials',`<h2>Tutorials</h2><h3>1. Your first garden in 10 minutes</h3><ol><li>Set your yard size in Setup (or pick the Starter template).</li><li>Enter latitude and which way north points.</li><li>Place the Coop + Pond first, on the lowest ground, then the Hydration Hub touching it.</li><li>Add growing modules, tall ones on the shade side, sun lovers in full sun.</li><li>Press Auto-connect, then read Layout checks and fix each warning.</li><li>Open 3D view to sanity-check heights and shade.</li></ol>
<h3>2. Is my water enough for the dry season?</h3><ol><li>Open the Climate card, load the Brasília preset or type your 12 monthly rain values.</li><li>The app simulates the Hub tank month by month and tells you when it runs dry and how much storage is missing.</li><li>Add a second IBC (variant) or more roof area, then re-run.</li></ol>
<h3>3. Compare two plans</h3><ol><li>Save the current plan as A, change it, save as B.</li><li>Compare modules, optimizer score, effective yard use and cost.</li></ol>
<h3>4. Plan the budget</h3><ol><li>Enter your own prices (they start empty on purpose).</li><li>Use phases to decide what to build first, then tick off the shopping list.</li></ol>`],
['why','Plants: what, where, why',`<h2>Plants: what, where and why</h2><p>${GP} unless marked. Check your local climate and extension office.</p><table><tr><th>Module</th><th>Plants</th><th>Why there</th></tr>
<tr><td>Wicking Bed</td><td>Potatoes, sweet potatoes, carrots, onions, garlic</td><td>Roots like steady moisture. The reservoir gives it without surface watering, so tubers rot less. Full sun.</td></tr>
<tr><td>Salad Tower</td><td>Lettuce, kale, spinach, basil, mint, strawberries</td><td>Shallow-rooted, fast leaves suit vertical towers. In hot climates give afternoon shade, lettuce bolts in heat.</td></tr>
<tr><td>Vine Wall</td><td>Tomatoes, cucumbers, peppers, melons</td><td>Heavy fruiting crops need strong support and lots of sun. The back edge keeps their shade off other modules.</td></tr>
<tr><td>Herb Spiral</td><td>Rosemary, thyme at the top (dry); mint, parsley at the base (wet)</td><td>The spiral makes dry, wet, sunny and shaded zones in one small footprint, near the kitchen.</td></tr>
<tr><td>Fruit Tree Guild</td><td>Dwarf apple, berries, comfrey, borage, clover</td><td>Each layer helps another: comfrey for mulch, borage for pollinators, clover as ground cover. Tree in the middle so it does not shade the rest.</td></tr>
<tr><td>Algae PBR</td><td>Spirulina</td><td>Needs full sun and its own alkaline water, never pond water, per the app's build guide.</td></tr>
<tr><td>Duckweed Tank</td><td>Duckweed</td><td>Floating, protein-rich feed for hens and fish. Partial sun and easy water exchange with the pond.</td></tr></table>
<h3>Planting rhythm</h3><ul><li>Start seedlings in the Nursery, plant out when roots fill the cell.</li><li>Stagger sowings every 2 to 3 weeks so harvests do not all arrive at once.</li><li>Rotate root crops in the Wicking Bed each season.</li></ul>`],
['animals','Animals and fish',`<h2>Chickens, fish and bees</h2><h3>Chickens</h3><ul><li>Space: ${OK} extension guidance is about 2.5 to 3.5 ft² per bird inside the coop (Cornell) or at least 3 ft² (Oregon State), plus about 8 to 10 ft² per bird in a run. Penn State lists lower bare minimums and warns that crowding causes pecking and cannibalism.</li><li>Roosts and nests: ${OK} about 5 to 10 inches of roost per bird and one nest box per four birds (Oregon State). Other sources say up to 12 inches, so lean larger.</li><li>Daily: fresh water and feed, collect eggs, look at every bird. Weekly: clean the coop. Keep it predator-proof with wire, not chicken mesh ${GP}.</li><li>The app's coop is 8×8 ft, which is 64 ft². At about 3 ft² per bird that is roughly 21 birds by floor area alone, but roost length, ventilation and the run set the real limit, so start with fewer and add slowly ${AS}.</li></ul>
<h3>Fish and the pond</h3><ul><li>The cycle: ${OK} bacteria turn ammonia into nitrite, then into nitrate that plants use (NMSU CR680).</li><li>Nitrite: ${OK} toxic to fish around 5 ppm. Keep it at or below 1 ppm for tilapia.</li><li>pH: ${OK} 7.0 to 7.5 is a good compromise for fish, plants and bacteria, with ammonia at or below 1 ppm (UF/IFAS). The toxic form of ammonia rises with both pH and temperature (NMSU).</li><li>Cycle the pond for 4 to 6 weeks before adding fish (from the app's guide). Test weekly, feed only what the fish finish, keep the aerator running.</li><li>Catfish are possible but UF/IFAS says they are less economic than tilapia in aquaponics.</li></ul>
<h3>Bees</h3><p>Morning sun, windbreak, water nearby, entrance away from paths. The app warns under 25 ft from the yard edge (UF/IFAS guide); your local rules may differ and Brazilian rules were not checked ${AS}.</p>
<div class="box warn"><b>Food safety.</b> Raw manure and untreated digestate carry pathogens. Wash produce, keep raw digestate away from the pond and from leaves you eat raw, and ask a local extension service for safe-handling rules ${GP}.</div>`],
['biogas','Biogas safety',`<h2>Biogas: safe use</h2><div class="box warn"><b>Review this before building anything.</b> The app's guide is a starting point, not an engineering design.</div>
<ul><li>What it is: ${OK} about 60% methane and 40% CO₂ with traces of hydrogen sulfide. Methane forms explosive mixtures with air (Penn State/eXtension).</li><li>Never smoke or allow ignition near the digester or lines, and never enter a space where manure is stored or a leak is suspected, because natural ventilation cannot be trusted to dilute it ${OK}.</li><li>Do not store gas in confined, badly ventilated spaces such as basements or small sheds. Use low-pressure storage, such as a flexible bladder above or beside the tank, and leak-test regularly ${OK}.</li><li>Fit a safety valve and use burners adapted for biogas ${OK} (HomeBiogas manual). Biogas is lighter than air, so vent and place outdoors.</li><li>Test every joint with soapy water before use and after any repair (also in the app's guide).</li><li>Match the digester to your gas use. Studies of household units in Kenya and Uganda show venting when the system over-pressurises, and units are often sized by feedstock instead of demand ${OK}.</li><li>Standards: The BSI household biogas standard covers systems below 5 kPa. Check what your country requires ${OK}.</li><li>Wash your hands after working with the digester or digestate.</li></ul>`],
['tips','Garden tips and management',`<h2>Tips and routines</h2><div class="box tip"><b>Daily 10 minutes:</b> eggs and water, look at the fish, check drips and wilting, feed the digester a little.<br><b>Weekly:</b> test pond pH and ammonia, clean the coop, harvest greens and larvae, check the Hub screen.<br><b>Monthly:</b> flush emitters and the first-flush diverter, add compost and mulch, draw off bioliquid.<br><b>Seasonal:</b> rotate crops, prune the tree, deep-clean the coop and towers, inspect tanks and blocks.</div>
<ul><li>Water in the morning and mulch bare soil to keep moisture ${GP}.</li><li>Keep a notebook: dates, pH, harvests, problems. Patterns show up after a month.</li><li>Change one thing at a time so you know what worked.</li><li>Quarantine new birds and fish before mixing them with the flock ${GP}.</li><li>Build in phases: water and coop first, then growing modules, then energy and extras.</li></ul>`],
['mods','Modules and build guides',`<h2>Modules, blueprints and build guides</h2><p>Generated from the planner's own data, so it always matches the app. Open any card for the blueprint, parts, build steps and care.</p>`+mods],
['refs','Research and references',`<h2>Research and references</h2><p>Every number in the app is labelled. Here is what was checked and what still needs work.</p>
<h3>Sources checked for this documentation</h3><ul class="ref">
<li>Penn State / eXtension, <a href="https://farm-energy.extension.org/anaerobic-digesters-and-biogas-safety/">Anaerobic digesters and biogas safety</a>: composition, explosion risk, confined spaces.</li>
<li>HomeBiogas, HBG 4.0 manual (<a href="https://thinkup.msf.org/a/community/thinkup/idea/2665/1027/download">PDF</a>): flammable, lighter than air, safety valve, biogas-adapted stoves.</li>
<li><a href="https://anaerobic-digestion.com/how-to-store-biogas-at-home/">How to store biogas at home</a>: ventilation, low-pressure storage, leak testing (industry guide).</li>
<li>BSI, <a href="https://knowledge.bsigroup.com/products/household-biogas-system-requirements-design-installation-operation-maintenance-and-safety-1">Household biogas system requirements</a>: scope under 5 kPa.</li>
<li>Heriot-Watt, <a href="https://researchportal.hw.ac.uk/en/publications/measuring-biogas-venting-from-over-pressurisation-of-household-sc/">Biogas venting in 53 household digesters, Kenya and Uganda</a>.</li>
<li>NMSU, <a href="https://pubs.nmsu.edu/_circulars/CR680/">CR-680 Water quality parameters in aquaponics</a>: ammonia and nitrite, tilapia nitrite limit.</li>
<li>UF/IFAS Orange County, <a href="https://www.seminolecountyfl.gov/core/fileparse.php/3360/urlt/orange-county-extension-fact-sheet-aquaponics-2013.pdf">Aquaponics fact sheet</a>: pH 7.0 to 7.5, ammonia, tilapia and catfish.</li>
<li>Oregon State Extension, <a href="https://extension.oregonstate.edu/node/226526">Backyard chicken coop design</a>: space, roosts, nest boxes.</li>
<li>eXtension poultry, <a href="https://poultry.extension.org/articles/getting-started-with-small-and-backyard-poultry/housing-for-small-and-backyard-poultry-flocks/space-allowances-in-housing-for-small-and-backyard-poultry-flocks/">Space allowances for small flocks</a>: crowding behaviour; little peer-reviewed research exists.</li>
<li>Cornell Cooperative Extension and Penn State space figures, as summarized in a <a href="https://sites.google.com/view/chicken-coop-space-needed">secondary guide</a>. Confirm against the originals.</li></ul>
<h3>Cited in the app notes, links still to add</h3><p>Honey per hive, dwarf and semi-dwarf apple yield, digestate nutrients, rooftop load (80 to 100 kg/m² saturated), the 25 ft bee setback (UF/IFAS) and the Brasília rainfall preset were researched in earlier sessions. Add the exact URLs to <code>docs.html</code> so readers can check them.</p>
<h3>Researched in this pass (guides updated)</h3><ul class="ref"><li><b>Wicking bed.</b> Soil 20 to 40 cm, reservoir 20 to 30 cm, container 40 to 60 cm deep, fill pipe, slotted pipe, geotextile, fill until the overflow runs: <a href="https://salife.com.au/?p=54585">InDaily SA</a>, <a href="https://deepgreenpermaculture.com/2021/08/06/gardening-questions-008-what-is-the-ideal-soil-depth-for-wicking-beds/">Deep Green Permaculture</a>, <a href="https://www.sgaonline.org.au/wp-content/uploads/2020/10/Wicking-Beds-handout.pdf">SGA handout</a>, <a href="https://www.waterups.com.au/optimal-height-of-a-wicking-bed/">WaterUps</a> (a vendor, used only for letting the reservoir nearly empty). <span class="tag q">weak sources</span> I found no university extension guide, so treat the depths as typical practice. <b>The old app guide said 12 in (30 cm) deep, which is shallower than all of these, so I changed it.</b></li><li><b>Worm bin.</b> 60 to 75 °F (about 15 to 25 °C), worms begin to die above 85 °F (about 29 °C), one pound of worms per square foot of surface, bury food and feed about weekly, no meat, dairy or greasy food: <a href="https://extension.okstate.edu/fact-sheets/vermicomposting-composting-with-worms">Oklahoma State Extension</a>, <a href="https://ucanr.edu/node/129818">UC Master Gardeners</a>, <a href="https://www.uaex.uada.edu/counties/clark/self-sufficient-u/posts/worm-composting-101.aspx">Arkansas Extension</a>, <a href="https://larimer.gov//solidwaste/vermicomposting">Larimer County</a>. ${OK} Outdoor bins in a hot climate like Brasília need shade, because the upper limit is only about 29 °C ${AS}.</li></ul><h3>Not yet researched</h3><p>Compost bays, greenhouse, herbs, solar derating, human needs, setbacks for the digester, generator and coop, nutrient target, prices, and the add-on space gains. Treat those numbers as ${AS}.</p>
<div class="box"><b>About accuracy.</b> Several sources above are extension guides, which are strong, and a few are industry or blog summaries, which are weaker. Space figures differ between authorities, so the docs give ranges. This is general guidance, not legal, engineering or veterinary advice. Check local rules for livestock, bees, gas and electricity.</div>`]
];
const main=document.getElementById('main'),nav=document.getElementById('nav');
main.innerHTML=S.map(s=>`<section id="${s[0]}" data-t>${s[2]}</section>`).join('');nav.innerHTML=S.map(s=>`<a href="#${s[0]}">${s[1]}</a>`).join('');
const links=[...nav.children],obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>l.classList.toggle('on',l.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-20% 0px -70% 0px'});document.querySelectorAll('main section').forEach(s=>obs.observe(s));
addEventListener('scroll',()=>{prog.style.width=scrollY/(document.body.scrollHeight-innerHeight)*100+'%'});
q.oninput=()=>{const v=q.value.toLowerCase();document.querySelectorAll('main section').forEach(s=>{const mods=[...s.querySelectorAll('.mod')];if(mods.length){mods.forEach(m=>m.classList.toggle('hide',!!v&&!m.textContent.toLowerCase().includes(v)));s.classList.toggle('hide',!!v&&mods.every(m=>m.classList.contains('hide')));}else s.classList.toggle('hide',!!v&&!s.textContent.toLowerCase().includes(v))})};
const root=document.documentElement,dk=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;th.onclick=()=>{root.dataset.theme=dk()?'light':'dark';th.textContent=dk()?'☀️':'🌙'};th.textContent=dk()?'☀️':'🌙';
</script></body></html>
